name: CD Resume App

on:
  workflow_run:
    workflows:
      - "CI Resume App"
    types:
      - completed
    branches:
      - local-mini-pc

jobs:
  connectivity-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:

      - name: Verify self-hosted runner
        run: |
          hostname
          whoami
          uname -m

      - name: Verify ssh connection to the host server
        run: |
          ssh -i ~/.ssh/deploy_vm_resume deploy@${{ secrets.APP_VM_IP }} hostname
          ssh -i ~/.ssh/deploy_vm_resume deploy@${{ secrets.APP_VM_IP }} docker ps
  
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:

      - name: Set deployment version
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "SHORT_SHA=${FULL_SHA::7}" >> "$GITHUB_ENV"


      - name: Show deployment version
        run: |
          echo "Deploying image tag: $SHORT_SHA"
    
      - name: Pull application image on app server
        run: |
          ssh -i ~/.ssh/deploy_vm_resume \
          deploy@${{ secrets.APP_VM_IP }} \
          "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/resume-tracker:${SHORT_SHA}"

      - name: Verify application image
        run: |
          ssh -i ~/.ssh/deploy_vm_resume \
          deploy@${{ secrets.APP_VM_IP }} \
          "docker image ls ${{ secrets.DOCKERHUB_USERNAME }}/resume-tracker"

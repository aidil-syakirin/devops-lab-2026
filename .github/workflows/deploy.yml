name: CI  Resume App

on:
  push:
    branches:
      - local-mini-pc

jobs:
  build-flask-app:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Initialize test database
        run: |
          cat docker/init.sql | docker exec -i ${{ job.services.postgres.id }} \
          psql -U appuser -d appdb

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Flask App image
        uses: docker/build-push-action@v7
        with:
         context: .
         platforms: linux/amd64
         push: false
         load: true
         tags: |
           ${{ secrets.DOCKERHUB_USERNAME }}/resume-tracker:latest
           ${{ secrets.DOCKERHUB_USERNAME }}/resume-tracker:${{ env.SHORT_SHA }}
       
      - name: Run Flask container
        run: |
          docker run -d \
            --name resume-tracker-test \
            --network host \
            -e DATABASE_URL="postgresql+psycopg://appuser:testpassword@localhost:5432/appdb" \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-tracker:${{ env.SHORT_SHA }}

      - name: DB endpoint health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

      - name: Visit data creation test
        run: |
          curl --fail \
          -X POST \
          -H "Content-Type: application/json" \
          -d '{"name":"ci-test"}' \
          http://localhost:5000/visit

      - name: Visit data retrieval test
        run: |
          response=$(curl --fail http://localhost:5000/visits)
          echo "$response"
          echo "$response" | grep -q '"name":"ci-test"'
       
      

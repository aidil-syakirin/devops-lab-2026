name: CI  Resume App

on:
  push:
    branches:
      - local-mini-pc

jobs:
  build-flask-app:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Initialize test database
        run: |
          cat docker/init.sql | docker exec -i ${{ job.services.postgres.id }} \
          psql -U appuser -d appdb

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Flask App image
        uses: docker/build-push-action@v7
        with:
         context: .
         platforms: linux/amd64
         push: false
         load: true
         tags: resume-tracker:test

      - name: Run Flask container
        run: |
          docker run -d \
            --name resume-tracker-test \
            --network host \
            -e DATABASE_URL="postgresql+psycopg://appuser:testpassword@localhost:5432/appdb" \
            resume-tracker:test

      - name: Test health endpoint
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
       
      
